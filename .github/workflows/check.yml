name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bunmail
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: bunmail
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bunmail -d bunmail"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.1
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo test --locked --test integration -- --ignored
        env:
          TEST_DATABASE_URL: postgres://bunmail:isolated-ci-only@localhost:5432/bunmail
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: node --check static/app.js
      - run: python3 scripts/setup.py --development
      - run: docker compose config --quiet
      - run: docker compose build app
